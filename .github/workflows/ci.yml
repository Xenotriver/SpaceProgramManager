name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, tests, synthetic bake, Godot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      SPM_DATA: ${{ runner.temp }}/spm-data
      SPM_REQUIRE_DATA: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt

      - name: Bake synthetic Moon, Mars and Earth fixtures
        run: |
          set -euo pipefail
          mkdir -p "$SPM_DATA"
          python pipeline/bake_moon.py --synthetic --out "$SPM_DATA/moon"
          python pipeline/bake_mars.py --synthetic --out "$SPM_DATA/mars"
          python pipeline/bake_earth.py --synthetic --out "$SPM_DATA/earth"
          python pipeline/bake_imagery.py --body=moon --synthetic --out "$SPM_DATA/moon"
          python pipeline/bake_imagery.py --body=mars --synthetic --out "$SPM_DATA/mars"
          python pipeline/bake_imagery.py --body=earth --synthetic --out "$SPM_DATA/earth"
          python pipeline/bake_fluid.py --body=earth --synthetic --out "$SPM_DATA/earth"
          test -s "$SPM_DATA/moon/color.bin"
          test -s "$SPM_DATA/moon/imagery.json"
          test -s "$SPM_DATA/mars/color.bin"
          test -s "$SPM_DATA/mars/imagery.json"
          test -s "$SPM_DATA/earth/color.bin"
          test -s "$SPM_DATA/earth/imagery.json"
          test -s "$SPM_DATA/earth/fluid.bin"
          test -s "$SPM_DATA/earth/fluid.json"

      - name: Pipeline sidecar tests
        run: python -m unittest discover -s pipeline/tests -p 'test_*.py' -v

      - name: Build
        run: dotnet build SpaceProgramManager.slnx

      - name: Test
        run: dotnet test Sim.Tests/Sim.Tests.csproj --no-build

      - name: Install Godot 4.7.2 mono
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o "$archive"
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  $archive" \
            | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          godot_bin="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_*mono_linux*' -print -quit)"
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Godot headless smoke and frame budget
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version
          run_smoke() {
            local body="$1"
            local label="$2"
            shift 2
            local slot="$RUNNER_TEMP/spm-ci-$label"
            mkdir -p "$slot"
            "$GODOT_BIN" --headless --path Game -- \
              "--body=$body" "--save=$slot" --nosave --fresh \
              "$@" --frame-budget=20 --frames=30
          }

          # True-colour coverage on every M4.5 view for both bodies.
          run_smoke moon moon-globe-color --view=globe --overlay=color
          run_smoke moon moon-region-color --view=region --region=589971619905011711 --overlay=color
          run_smoke moon moon-management-color --view=management --region=589971619905011711 --overlay=color
          run_smoke mars mars-globe-color --view=globe --overlay=color
          run_smoke mars mars-region-color --view=region --region=589971619905011711 --overlay=color
          run_smoke mars mars-management-color --view=management --region=589971619905011711 --overlay=color

          # Analytical fallback and unchanged site/grid coverage.
          run_smoke moon moon-globe-biome --view=globe --overlay=biome
          run_smoke moon moon-region-biome --view=region --region=589971619905011711 --overlay=biome
          run_smoke moon moon-site --view=site --region=589971619905011711 --hex=0
          run_smoke mars mars-globe-biome --view=globe --overlay=biome
          run_smoke mars mars-region-biome --view=region --region=589971619905011711 --overlay=biome

          # M5 C1 tech screen.
          run_smoke moon moon-tech --tech

          # M5 C2 area view and rover fleet screens.
          run_smoke moon moon-area --view=area
          run_smoke mars mars-area --view=area
          run_smoke moon moon-fleet --view=area --fleet

          # Area-first navigation: slope automation hook.
          run_smoke moon moon-area-slope --region=589971619905011711 --slope

          # Area-first navigation: isometric diorama overlays.
          run_smoke moon moon-area-iso --view=area --region=589971619905011711 --projection=iso
          run_smoke moon moon-area-iso-terrain --view=area --region=589971619905011711 --projection=iso --overlay=terrain
          run_smoke moon moon-area-iso-score --view=area --region=589971619905011711 --projection=iso --overlay=score
          run_smoke moon moon-area-iso-buildings --view=area --region=589971619905011711 --projection=iso --overlay=buildings
          run_smoke moon moon-area-iso-color --view=area --region=589971619905011711 --projection=iso --overlay=color

          # M5 C3 missions: contract offers and event choices on both bodies.
          run_smoke moon moon-missions --missions
          run_smoke mars mars-missions --missions

          # M5 C4 maintenance: failure list and repair actions on both bodies.
          run_smoke moon moon-maintenance --maintenance
          run_smoke mars mars-maintenance --maintenance

          # Earth water, fluid overlay and barge/port coverage.
          run_smoke earth earth-globe-color --view=globe --overlay=color
          run_smoke earth earth-region-color --view=region --region=590241962326491135 --overlay=color
          run_smoke earth earth-region-biome --view=region --region=590231860563410943 --overlay=biome
          run_smoke earth earth-management --view=management --region=590500691156402175 --overlay=color
          run_smoke earth earth-area --view=area --region=590500691156402175
          run_smoke earth earth-area-iso --view=area --region=590500691156402175 --projection=iso
          run_smoke earth earth-fleet --view=area --fleet
